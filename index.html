<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المسابقة</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: radial-gradient(circle at center, #180a29 0%, #05030a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .card {
            background: rgba(22, 14, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(157, 78, 221, 0.3);
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(123, 44, 191, 0.25);
            width: 90%;
            max-width: 380px;
            text-align: center;
            animation: cardAppear 0.5s ease-out;
        }

        h2 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            text-shadow: 0 0 12px rgba(199, 125, 255, 0.6);
        }

        p {
            color: #b8a7d1;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .q-box {
            background: rgba(10, 6, 18, 0.5);
            border: 1px solid rgba(157, 78, 221, 0.2);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: right;
        }

        .q-box label {
            display: block;
            font-size: 15px;
            color: #c77dff;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(10, 6, 18, 0.7);
            border: 1px solid rgba(157, 78, 221, 0.4);
            border-radius: 10px;
            font-size: 16px;
            color: #fff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder { color: #6d597a; }

        input:focus {
            border-color: #c77dff;
            box-shadow: 0 0 15px rgba(199, 125, 255, 0.5);
            background: rgba(15, 8, 28, 0.9);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.5);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(157, 78, 221, 0.8);
            background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
        }

        .hidden { display: none; }

        .success {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success svg {
            width: 70px;
            height: 70px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(199, 125, 255, 0.8));
        }

        .score-badge {
            display: inline-block;
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid #c77dff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 18px;
            color: #ffffff;
            margin-top: 10px;
            font-weight: bold;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- المرحلة الأولى: أدخل اسم الحساب -->
    <div id="step-username">
        <h2>دخول المسابقة 🏆</h2>
        <p>اكتب اسم حسابك للبدء:</p>
        <input type="text" id="username" placeholder="@username" required>
        <button onclick="goToQuiz()">التالي</button>
    </div>

    <!-- المرحلة الثانية: اختبار الرياضيات -->
    <div id="step-quiz" class="hidden">
        <h2>اختبار الدخول 🧠</h2>
        <p>أجب عن الأسئلة لتأكيد دخولك:</p>
        
        <div class="q-box">
            <label>السؤال الأول: 4 × 15 = ؟</label>
            <input type="number" id="q1" placeholder="الإجابة">
        </div>

        <div class="q-box">
            <label>السؤال الثاني: 144 ÷ 12 = ؟</label>
            <input type="number" id="q2" placeholder="الإجابة">
        </div>

        <div class="q-box">
            <label>السؤال الثالث: 35 + 47 = ؟</label>
            <input type="number" id="q3" placeholder="الإجابة">
        </div>

        <button onclick="sendData()">إرسال</button>
    </div>

    <!-- المرحلة الثالثة: النجاح والنتيجة -->
    <div id="step-success" class="hidden success">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c77dff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" stroke="#7b2cbf" fill="rgba(123, 44, 191, 0.25)"/>
            <path d="M8 12l3 3 5-5"/>
        </svg>
        <h3 style="color: #c77dff; margin: 0; font-size: 22px;">تم الإرسال بنجاح!</h3>
        <div class="score-badge" id="score-display">النتيجة: 0 / 3</div>
    </div>
</div>

<script>
let usernameVal = "";

function goToQuiz() {
    usernameVal = document.getElementById('username').value.trim();
    if (!usernameVal) return alert('فضلاً اكتب اسم الحساب أولاً!');

    document.getElementById('step-username').classList.add('hidden');
    document.getElementById('step-quiz').classList.remove('hidden');
}

function sendData() {
    const q1 = document.getElementById('q1').value.trim();
    const q2 = document.getElementById('q2').value.trim();
    const q3 = document.getElementById('q3').value.trim();

    if (!q1 || !q2 || !q3) return alert('فضلاً أجب عن جميع الأسئلة!');

    // حساب الدرجة
    let score = 0;
    if (parseInt(q1) === 60) score++;
    if (parseInt(q2) === 12) score++;
    if (parseInt(q3) === 82) score++;

    // إظهار واجهة النجاح والنتيجة
    document.getElementById('step-quiz').classList.add('hidden');
    document.getElementById('step-success').classList.remove('hidden');
    document.getElementById('score-display').innerText = `النتيجة: ${score} من 3`;

    // إرسال الاسم والنتيجة إلى Web3Forms
    const data = new FormData();
    data.append("access_key", "45b47b3b-22ab-4fa5-adc6-0afe362588bc");
    data.append("subject", "🏆 مشارك جديد - نتيجة المسابقة");
    data.append("اسم الحساب المشارك", usernameVal);
    data.append("نتيجة الاختيار", `${score} من 3`);

    fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: data
    });
}
</script>

</body>
</html>
